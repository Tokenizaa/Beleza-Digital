name: Prospecting worker validation

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: "Publicar o Worker de prospecção no Cloudflare"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate application
        run: |
          npm run test
          npm run lint
          npm run build
      - name: Validate the dedicated Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN Actions secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID Actions secret" && exit 1)
          npx wrangler deploy --config wrangler.prospecting-scheduler.toml --dry-run

      - name: Deploy the dedicated prospecting Worker
        if: ${{ inputs.deploy_worker == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.prospecting-scheduler.toml
