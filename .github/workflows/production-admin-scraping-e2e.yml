name: Production admin and scraping E2E

on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/production-admin-scraping.spec.ts'
      - '.github/workflows/production-admin-scraping-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-admin-scraping-e2e
  cancel-in-progress: false

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://beleza-digital.pages.dev
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.ADMIN_TEST_LOGIN || secrets.ADMIN_TEST_EMAIL || secrets.TEST_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.ADMIN_TEST_PASSWORD || secrets.TEST_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate E2E credentials are present (values are never printed)
        shell: bash
        run: |
          if [ -z "$E2E_ADMIN_EMAIL" ] || [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "::error::Configure the admin test credentials in GitHub Actions secrets (E2E_ADMIN_EMAIL/E2E_ADMIN_PASSWORD or supported ADMIN_TEST_* aliases)."
            exit 1
          fi
          echo "Admin E2E credentials are present."

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run production login, protected-route, CRM, and real scraping checks
        run: bunx playwright test tests/e2e/production-admin-scraping.spec.ts --project=Chromium --reporter=list
