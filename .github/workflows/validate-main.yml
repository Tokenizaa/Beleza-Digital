name: Validate main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Type check
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate five templates with Playwright
        run: npx playwright test --config=playwright.templates.config.ts

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
