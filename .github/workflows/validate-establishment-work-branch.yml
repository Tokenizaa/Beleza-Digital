name: Validate establishment work branch

on:
  push:
    branches:
      - work/painel-estabelecimento-fases-1-5

permissions:
  contents: read

concurrency:
  group: validate-establishment-work-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Type check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate five templates
        run: npx playwright test --config=playwright.templates.config.ts
